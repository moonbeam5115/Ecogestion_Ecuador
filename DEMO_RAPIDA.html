<style>

.main{min-width:0;flex:1}.topbar{height:77px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 clamp(22px,4vw,60px);gap:20px}.top-left{display:flex;align-items:center;gap:11px;font-weight:650;font-size:13px;color:#687e73}.dot{height:8px;width:8px;border-radius:50%;background:#54b98b}.top-right{display:flex;align-items:center;gap:12px}.demo-label{font-size:11px;font-weight:850;letter-spacing:1px;color:#267352;border:1px solid #b9dccc;background:#eafaef;border-radius:20px;padding:7px 11px}.avatar{background:#d9e9df;color:#236044;border-radius:50%;height:34px;width:34px;display:grid;place-items:center;font-size:12px;font-weight:800}
.content{max-width:1480px;margin:auto;padding:34px clamp(22px,4vw,60px) 60px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:27px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--green);font-size:11px;font-weight:850;margin-bottom:8px}.head h1{font-size:clamp(26px,3.1vw,38px);letter-spacing:-1.35px;line-height:1.14;margin:0 0 10px;color:#153a2e}.head p{color:var(--sub);margin:0;font-size:13px;line-height:1.6;max-width:720px}.head-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--forest2);border:1px solid var(--forest2);color:#fff;padding:11px 15px;font-size:12px;font-weight:750;border-radius:9px;white-space:nowrap;box-shadow:0 5px 15px #14493612}.btn:hover{background:#236b51}.btn.light{background:#fff;color:#325446;border:1px solid #d8e5db;box-shadow:none}.btn.light:hover{background:#edf5f0}.btn.sm{padding:7px 11px;font-size:11px}.btn.danger{background:#fff0ee;color:#bd4d42;border-color:#f6d8d4}.btn:disabled{opacity:.5;cursor:not-allowed}.select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:#375547;background:#fff;max-width:240px;min-width:150px;font-size:12px}.notice{background:#edf5ed;border:1px solid #d6eadc;color:#587967;padding:11px 16px;border-radius:10px;font-size:12px;line-height:1.5;margin-bottom:22px}.notice b{color:#31664d}.grid{display:grid;gap:17px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:24px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.kpi{padding:22px;min-height:145px;position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;right:-26px;top:-26px;background:var(--mint);opacity:.6;width:100px;height:100px;border-radius:50%}.kpi span{font-size:12px;color:#72867b;font-weight:650}.kpi strong{font-size:35px;display:block;margin-top:13px;color:#183a2f;line-height:1;font-weight:800;letter-spacing:-1.5px}.kpi em{font-size:11px;font-style:normal;color:#97a49e;display:block;margin-top:12px}.kpi .k-icon{position:absolute;right:21px;bottom:26px;color:#65a28a;font-size:20px}.dashboard-grid{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);align-items:stretch}.panel{padding:22px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}.panel-title h3{margin:0;font-size:15px;letter-spacing:-.35px;color:#1c3c30}.micro{font-size:11px;color:var(--sub)}.panel-link{font-size:11px;color:var(--green);font-weight:750;border:0;background:none}.barrow{display:grid;grid-template-columns:130px 1fr 30px;align-items:center;gap:13px;padding:12px 0;color:#5b7468;font-size:12px}.track{height:9px;border-radius:10px;background:#f0f3ef;overflow:hidden}.fill{height:100%;border-radius:10px;min-width:2px}.barrow strong{font-size:12px;text-align:right;color:#334f42}.table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;min-width:660px;font-size:12px;text-align:left}.data-table th{color:#8a998f;background:#f9fbf9;text-transform:uppercase;letter-spacing:.7px;font-size:10px;font-weight:800;padding:13px 16px;border-bottom:1px solid var(--line)}.data-table td{padding:15px 16px;border-bottom:1px solid #edf1ed;vertical-align:middle;color:#51695b}.data-table tbody tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:#fbfdfb}.data-table td b{font-weight:750;color:#263f33;display:block}.data-table td small{color:#98a69d;font-size:11px;margin-top:4px;display:block}.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:6px 9px;border-radius:20px;white-space:nowrap;font-weight:800}.pill.red{color:#ba4b45;background:#ffebe9}.pill.orange{color:#be6b28;background:#fff0e4}.pill.yellow{color:#977223;background:#fff6dc}.pill.green{color:#257e57;background:#e3f5ea}.pill.blue{color:#38749c;background:#e8f4fc}.pill.gray{color:#7d8c80;background:#eff2ed}.pill:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.project-list{display:grid;gap:11px}.project{border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.project:hover{border-color:#b4d8c3;cursor:pointer;background:#fafffb}.project .p-avatar{height:37px;width:37px;background:#e8f2eb;border-radius:10px;display:grid;place-items:center;color:#41835f}.project .p-copy{flex:1;min-width:0}.project b{font-size:12px;display:block;color:#2d4b3c}.project small{font-size:11px;display:block;margin-top:5px;color:var(--sub)}.project .count{font-size:11px;font-weight:700;color:#59846b}.span2{grid-column:span 2}.hint{font-size:12px;color:var(--sub);line-height:1.65}.empty{border:1px dashed #cadace;border-radius:10px;padding:22px;color:#77877b;font-size:12px;text-align:center}.list{display:grid;gap:10px}.candidate{padding:22px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:var(--shadow)}.candidate-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.candidate .quote{background:#f7faf7;border-left:3px solid #8ccaa9;padding:18px 20px;border-radius:5px;font-size:14px;color:#405d4f;line-height:1.8;margin:10px 0 18px}.candidate-actions{display:flex;gap:9px;flex-wrap:wrap}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.4fr);gap:17px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:11px;color:#61776b;font-weight:750}.field input,.field select,.field textarea{background:#fff;border:1px solid #d8e4db;border-radius:8px;padding:11px 12px;font-size:12px;color:#284538;width:100%;min-width:0}.field textarea{resize:vertical;min-height:65px}.field.full{grid-column:1/-1}.modal-shade{position:fixed;inset:0;background:#0a1f16a8;z-index:50;display:grid;place-items:center;padding:20px;overflow:auto}.modal{background:#fff;border-radius:17px;max-width:590px;width:100%;box-shadow:0 25px 90px #061e1399;overflow:hidden;max-height:95vh;overflow-y:auto}.modal-head{padding:23px 26px 15px;display:flex;justify-content:space-between;gap:12px;align-items:start}.modal-head h3{margin:0 0 6px;letter-spacing:-.4px;color:var(--forest);font-size:20px}.modal-head p{margin:0;font-size:12px;color:var(--sub)}.modal-body{padding:13px 26px 26px}.modal-close{border:none;background:#f1f5f1;border-radius:50%;height:29px;width:29px;color:#5c6f61}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.toast{position:fixed;right:25px;bottom:25px;background:#164b36;color:#fff;padding:15px 19px;font-size:12px;border-radius:10px;box-shadow:0 13px 35px #15442642;z-index:90}.smallprint{font-size:11px;color:#95a299}.action-link{background:none;border:none;color:#218058;font-weight:750;font-size:11px;padding:0}.workflow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.workflow .step{background:#f8fbf8;border:1px solid #deebdf;border-radius:10px;padding:16px}.workflow .num{background:#d9f0e1;color:#246e50;display:inline-grid;place-items:center;border-radius:8px;height:26px;width:26px;margin-bottom:10px;font-weight:800;font-size:12px}.workflow b{font-size:12px;display:block}.workflow small{display:block;color:#829287;font-size:11px;margin-top:6px;line-height:1.5}.mobile-menu{display:none}.footer{margin-top:35px;border-top:1px solid var(--line);padding-top:20px;font-size:11px;color:#9ba9a0}.report-highlight{background:#f5fbf6;border:1px solid #dbeade;border-radius:12px;padding:19px;margin-top:15px}.report-highlight h3{margin:0 0 8px;font-size:15px}.report-highlight p{font-size:12px;color:#698070;line-height:1.6;margin:0}
@media(max-width:1080px){.side{width:224px}.kpis{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.content{padding:30px 24px}.workflow{grid-template-columns:repeat(2,1fr)}}
@media(max-width:690px){.layout{display:block}.side{position:fixed;transform:translateX(-110%);transition:transform .2s;box-shadow:0 0 20px #0003}.side.open{transform:translateX(0)}.mobile-menu{display:inline-flex;border:0;background:none;color:var(--forest);font-size:22px;margin-right:9px}.topbar{padding:0 16px;height:63px}.top-left{font-size:11px}.top-right{gap:7px}.avatar{display:none}.demo-label{font-size:9px}.content{padding:26px 16px}.head{align-items:flex-start;flex-direction:column}.head-actions{justify-content:flex-start}.kpis{gap:10px}.kpi{padding:16px;min-height:123px}.kpi strong{font-size:30px}.barrow{grid-template-columns:100px 1fr 25px}.form-grid{grid-template-columns:1fr}.workflow{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}
</style>

<body>
<div class="layout">
<aside class="side" id="side">
 <div class="brand"><span class="logo">❋</span><div><strong>EcoGestión</strong><small>EC · Plataforma ambiental</small></div></div>
 <div class="group-label">Espacio de trabajo</div>
 <nav id="nav"></nav>
 <div class="side-bottom"><div>🧪 <b>Entorno demostrativo</b></div>Todos los nombres, registros y documentos son ficticios. No se conecta a SUIA ni certifica cumplimiento.<button class="reset" data-act="reset">↺ Restaurar datos de demostración</button></div>
</aside>
<main class="main">
 <header class="topbar"><div class="top-left"><button class="mobile-menu" data-act="menu" aria-label="Abrir menú">☰</button><span class="dot"></span> Gestión ambiental / Ecuador <span id="crumb"></span></div><div class="top-right"><span class="demo-label">MODO DEMO · LOCAL</span><div class="avatar">EC</div></div></header>
 <section class="content" id="content"></section>
</main></div>
<div id="modalroot"></div><div id="toastroot"></div>
<script>
'use strict';
const STORE='ecogestion_demoweb_v2';
const today=new Date();today.setHours(12,0,0,0);
const day=(delta)=>{let d=new Date(today);d.setDate(d.getDate()+delta);return d.toISOString().slice(0,10)};
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({
 companies:[{id:1,name:'Andes Circular S.A. (FICTICIA)',ruc:'DEMO-000000000'},{id:2,name:'Pacífico Textil Cía. Ltda. (FICTICIA)',ruc:'DEMO-000000001'}],
 sites:[{id:1,companyId:1,name:'Planta Cuenca',city:'Cuenca, Azuay',activity:'Recuperación de materiales',permit:'Por verificar'},{id:2,companyId:1,name:'Centro logístico Guayaquil',city:'Guayaquil, Guayas',activity:'Acopio y logística',permit:'Por verificar'},{id:3,companyId:2,name:'Taller Manta',city:'Manta, Manabí',activity:'Operación textil',permit:'Por verificar'}],
 obligations:[{id:1,siteId:1,title:'Monitoreo de ruido',freq:'Anual',due:day(5),owner:'Equipo ambiental',evidence:[],required:'Informe técnico',completed:false,source:'Registro manual'},{id:2,siteId:1,title:'Informe de seguimiento',freq:'Semestral',due:day(24),owner:'Consultora externa',evidence:[],required:'Informe firmado',completed:false,source:'Registro manual'},{id:3,siteId:1,title:'Registro de residuos',freq:'Mensual',due:day(-4),owner:'Encargado ambiental',evidence:[],required:'Bitácora',completed:false,source:'Registro manual'},{id:4,siteId:1,title:'Capacitación de personal',freq:'Semestral',due:day(-12),owner:'RR. HH.',evidence:[{name:'acta_ejemplo.pdf',reviewed:true}],required:'Acta de capacitación',completed:true,source:'Registro manual'},{id:5,siteId:2,title:'Verificación de almacenamiento',freq:'Mensual',due:day(3),owner:'Coordinación logística',evidence:[],required:'Lista de inspección',completed:false,source:'Registro manual'},{id:6,siteId:2,title:'Actualización documental',freq:'Única',due:day(45),owner:'Encargado de planta',evidence:[],required:'Expediente',completed:false,source:'Registro manual'},{id:7,siteId:3,title:'Revisión de descargas',freq:'Anual',due:day(-2),owner:'Equipo ambiental',evidence:[],required:'Informe',completed:false,source:'Registro manual'},{id:8,siteId:3,title:'Inspección de planta',freq:'Mensual',due:day(18),owner:'Jefatura técnica',evidence:[],required:'Checklist',completed:false,source:'Registro manual'}],
 candidates:[{id:1,siteId:1,page:1,doc:'resolucion_ficticia_demo.pdf',text:'En el presente caso ficticio, el operador deberá realizar un monitoreo anual de ruido.',frequency:'Anual',status:'pending'},{id:2,siteId:1,page:2,doc:'resolucion_ficticia_demo.pdf',text:'El operador presentará un informe de seguimiento semestral.',frequency:'Semestral',status:'pending'}],
 wastes:[{id:1,siteId:1,date:day(0),name:'Aceite usado (ejemplo)',qty:850,classification:'Por determinar',storage:'Bodega A',manager:'No registrado',manifest:'—'},{id:2,siteId:2,date:day(0),name:'Envases contaminados (ejemplo)',qty:125,classification:'Por determinar',storage:'Bodega logística',manager:'No registrado',manifest:'—'}]
});
let state;try{state=JSON.parse(localStorage.getItem(STORE))||seed()}catch(_){state=seed()}
let view='dashboard',scope='all',modal='',search='';
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch(_){}};
const site=(id)=>state.sites.find(x=>x.id===+id);
const company=(id)=>state.companies.find(x=>x.id===+id);
const filtered=(rows,key='siteId')=>scope==='all'?rows:rows.filter(x=>x[key]===+scope);
const fmtDate=(date)=>date?new Date(date+'T12:00:00').toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'}):'Sin fecha';
const dueDays=(date)=>!date?Infinity:Math.round((new Date(date+'T12:00:00')-today)/86400000);
const status=(o)=>{if(o.completed)return {t:'Cumplida',c:'green'};if(!o.due)return {t:'Sin fecha',c:'gray'};const d=dueDays(o.due);return d<0?{t:'Vencida',c:'red'}:d<=7?{t:'0–7 días',c:'orange'}:d<=30?{t:'8–30 días',c:'yellow'}:{t:'En plazo',c:'blue'}};
const pill=(s)=>`<span class="pill ${s.c}">${esc(s.t)}</span>`;
const button=(t,act,cls='')=>`<button class="btn ${cls}" data-act="${act}">${t}</button>`;
const header=(pre,h,sub,actions='')=>`<div class="head"><div><div class="eyebrow">${pre}</div><h1>${h}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></div>`;
const boxTitle=(h,more='')=>`<div class="panel-title"><h3>${h}</h3>${more}</div>`;
const siteOpts=(includeAll=false)=>`${includeAll?'<option value="all">Todos los proyectos</option>':''}${state.sites.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.city)}</option>`).join('')}`;
const statusList=()=>({red:filtered(state.obligations).filter(o=>status(o).c==='red').length,orange:filtered(state.obligations).filter(o=>status(o).c==='orange').length,yellow:filtered(state.obligations).filter(o=>status(o).c==='yellow').length,green:filtered(state.obligations).filter(o=>status(o).c==='green').length});
const views=[['dashboard','▦','Panel general'],['projects','▤','Empresas y proyectos'],['documents','▧','Documentos y revisión'],['obligations','☑','Obligaciones'],['alerts','◷','Alertas'],['waste','♻','Residuos'],['reports','⇩','Reportes']];
function renderNav(){document.querySelector('#nav').innerHTML=views.map(([v,i,t])=>`<button class="nav ${view===v?'active':''}" data-view="${v}"><span class="ico">${i}</span>${t}</button>`).join('')};
function dashboard(){const obs=filtered(state.obligations), ss=filtered(state.sites,'id'), ct=statusList();let nums=[['Obligaciones activas',obs.filter(o=>!o.completed).length,'En seguimiento','☑'],['Vencidas',ct.red,'Requieren atención','!'],['Próximos 30 días',ct.orange+ct.yellow,'Vencimientos cercanos','◷'],['Completadas',ct.green,'Con evidencia validada','✓']];let total=Math.max(1,obs.length);
return header('Vista general','Control ambiental, en un solo lugar','Seguimiento centralizado de compromisos, documentos y trazabilidad por establecimiento.',`<select class="select" id="globalScope" aria-label="Filtrar por proyecto">${siteOpts(true)}</select>${button('+ Nueva obligación','newObligation')}`)+`<div class="notice"><b>Prototipo demostrativo.</b> No realiza clasificación normativa oficial, no se conecta a SUIA y no representa datos de compañías reales. Los vencimientos provienen de fechas ingresadas, no inferidas.</div>`+`<div class="grid kpis">${nums.map((n)=>`<div class="card kpi"><span>${n[0]}</span><strong>${n[1]}</strong><em>${n[2]}</em><span class="k-icon">${n[3]}</span></div>`).join('')}</div>`+
`<div class="grid dashboard-grid"><div class="card panel">${boxTitle('Estado de cumplimiento',`<span class="micro">${obs.length} obligaciones registradas</span>`)}${[['Vencidas','red','#c85a5a',ct.red],['Próximos 7 días','orange','#df8b4f',ct.orange],['Próximos 30 días','yellow','#dcb65b',ct.yellow],['Completadas','green','#4caa7f',ct.green]].map(([name,cls,color,n])=>`<div class="barrow"><span>${name}</span><div class="track"><div class="fill" style="width:${100*n/total}%;background:${color}"></div></div><strong>${n}</strong></div>`).join('')}<div class="hint" style="margin-top:22px">Los indicadores muestran registros internos de esta demo, no una evaluación de cumplimiento legal.</div></div><div class="card panel">${boxTitle('Proyectos registrados',`<button class="panel-link" data-view="projects">Ver todos →</button>`)}<div class="project-list">${ss.map(s=>`<div class="project" data-scope="${s.id}"><div class="p-avatar">⌂</div><div class="p-copy"><b>${esc(s.name)}</b><small>${esc(s.city)}</small></div><span class="count">${state.obligations.filter(o=>o.siteId===s.id&&!o.completed).length} activos →</span></div>`).join('')||'<div class="empty">No hay proyectos en el filtro</div>'}</div></div></div>`+
`<div class="card panel" style="margin-top:18px">${boxTitle('Compromisos prioritarios',`<button class="panel-link" data-view="obligations">Gestionar obligaciones →</button>`)}${tableObligations(obs.filter(o=>!o.completed).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5))}</div>`;
}
function tableObligations(obs,actions=false){if(!obs.length)return '<div class="empty">No se encontraron obligaciones.</div>';return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Obligación</th><th>Establecimiento</th><th>Vencimiento</th><th>Estado</th><th>Responsable</th>${actions?'<th>Acción</th>':''}</tr></thead><tbody>${obs.map(o=>`<tr><td><b>${esc(o.title)}</b><small>${esc(o.freq)} · ${esc(o.source)}</small></td><td>${esc(site(o.siteId)?.name||'—')}</td><td>${fmtDate(o.due)}</td><td>${pill(status(o))}</td><td>${esc(o.owner||'—')}</td>${actions?`<td><button class="action-link" data-act="obligation:${o.id}">Gestionar →</button></td>`:''}</tr>`).join('')}</tbody></table></div>`};
function projects(){return header('Organización','Empresas y establecimientos','Cada empresa puede tener múltiples instalaciones. Las obligaciones están asociadas al establecimiento correspondiente.',`${button('+ Empresa','newCompany','light')}${button('+ Proyecto','newSite')}`)+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${state.companies.map(c=>`<div class="card panel">${boxTitle('◈ '+esc(c.name))}<p class="smallprint">RUC ficticio: ${esc(c.ruc)}</p><div class="project-list">${state.sites.filter(s=>s.companyId===c.id).map(s=>`<div class="project" data-scope="${s.id}"><div class="p-avatar">⌂</div><div class="p-copy"><b>${esc(s.name)}</b><small>${esc(s.city)} · ${esc(s.activity)}</small></div><span class="count">→</span></div>`).join('')||'<div class="empty">Sin establecimientos</div>'}</div></div>`).join('')}</div>`};
function documents(){const candidates=filtered(state.candidates),pending=candidates.filter(c=>c.status==='pending'),rest=candidates.filter(c=>c.status!=='pending');return header('Gestión documental','Revisión de documentos','El sistema propone fragmentos con trazabilidad de documento y página. Una persona debe aprobarlos antes de convertirlos en obligaciones.',`${button('Ver documento ficticio','pdfInfo','light')}`)+`<div class="workflow">${[['1','Cargar PDF','Documento de texto seleccionable'],['2','Detectar fragmentos','Heurísticas y páginas de origen'],['3','Revisión humana','Aceptar o descartar cada propuesta'],['4','Seguimiento','Fecha, responsable y evidencia']].map(q=>`<div class="step"><span class="num">${q[0]}</span><b>${q[1]}</b><small>${q[2]}</small></div>`).join('')}</div><div class="notice"><b>Importante:</b> estos fragmentos ya vienen cargados como muestra. Para probar extracción de un PDF real, abre la aplicación Streamlit incluida en el paquete.</div><div class="grid" style="gap:16px">${pending.map(c=>`<div class="candidate"><div class="candidate-head"><b style="font-size:13px">📄 ${esc(c.doc)}</b><span class="pill yellow">Pág. ${c.page} · ${esc(c.frequency)}</span></div><div class="micro">${esc(site(c.siteId)?.name||'')}</div><div class="quote">“${esc(c.text)}”</div><div class="candidate-actions"><button class="btn sm" data-act="approve:${c.id}">✓ Revisar y aceptar</button><button class="btn sm light" data-act="discard:${c.id}">Descartar</button></div></div>`).join('')||'<div class="empty">No hay fragmentos pendientes en este filtro.</div>'}</div>`+(rest.length?`<div class="card panel" style="margin-top:18px">${boxTitle('Revisiones realizadas')}<div class="list">${rest.map(c=>`<div class="project"><div class="p-copy"><b>${esc(c.doc)} · página ${c.page}</b><small>${esc(c.text)}</small></div>${pill(c.status==='approved'?{t:'Aceptada',c:'green'}:{t:'Descartada',c:'gray'})}</div>`).join('')}</div></div>`:'')};
function obligations(){let obs=filtered(state.obligations).filter(o=>(o.title+' '+o.owner+' '+site(o.siteId)?.name).toLowerCase().includes(search.toLowerCase()));return header('Calendario de cumplimiento','Obligaciones y evidencias','Crea compromisos con fechas conocidas, adjunta nombres de evidencia y confirma revisión antes de marcar cumplimiento.',`${button('+ Crear obligación','newObligation')}`)+`<div class="card panel"><div class="panel-title"><h3>Registro de compromisos</h3><input class="select" id="search" placeholder="Buscar obligación..." style="max-width:260px" value="${esc(search)}"></div>${tableObligations(obs,true)}</div><div class="report-highlight"><h3>Regla de cumplimiento</h3><p>Una obligación no puede marcarse como cumplida hasta que exista al menos una evidencia revisada. La demo del navegador guarda solo nombres y estados de los archivos; la versión Streamlit permite adjuntar los archivos reales.</p></div>`};
function alerts(){let obs=filtered(state.obligations),pending=obs.filter(o=>!o.completed).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return header('Prioridades','Centro de alertas','Vista dinámica de vencimientos calculados desde fechas manualmente registradas.',button('Descargar pendientes CSV','exportObligations','light'))+`<div class="grid kpis">${[['Vencidas','red'],['0–7 días','orange'],['8–30 días','yellow'],['Sin fecha','gray']].map(([t,c])=>`<div class="card kpi"><span>${t}</span><strong>${obs.filter(o=>status(o).c===c).length}</strong><em>Registros del prototipo</em></div>`).join('')}</div><div class="card panel">${boxTitle('Pendientes por prioridad')}${tableObligations(pending,true)}</div><div class="notice" style="margin-top:18px">Las alertas aparecen dentro de la aplicación; no se envían mensajes externos ni correos automáticos.</div>`};
function waste(){let w=filtered(state.wastes);return header('Trazabilidad','Gestión de residuos','Bitácora local de generación y movimientos. No constituye balance de inventario ni clasificación legal.',`${button('+ Registrar residuo','newWaste')}${button('Exportar CSV','exportWaste','light')}`)+`<div class="grid kpis">${[['Registros',w.length],['Kg registrados',w.reduce((n,x)=>n+x.qty,0).toLocaleString('es-EC')],['Instalaciones',new Set(w.map(x=>x.siteId)).size],['Manifiestos',w.filter(x=>x.manifest&&x.manifest!=='—').length]].map(([t,n])=>`<div class="card kpi"><span>${t}</span><strong>${n}</strong><em>Datos ilustrativos</em></div>`).join('')}</div><div class="card panel">${boxTitle('Bitácora de residuos')}<div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Residuo</th><th>Proyecto</th><th>Clasificación declarada</th><th>Cantidad</th><th>Almacenamiento</th></tr></thead><tbody>${w.map(x=>`<tr><td>${fmtDate(x.date)}</td><td><b>${esc(x.name)}</b><small>Manifiesto: ${esc(x.manifest)}</small></td><td>${esc(site(x.siteId)?.name)}</td><td>${pill({t:x.classification,c:'gray'})}</td><td>${x.qty} kg</td><td>${esc(x.storage)}</td></tr>`).join('')||'<tr><td colspan="6">No hay registros.</td></tr>'}</tbody></table></div></div>`};
function reports(){let obs=filtered(state.obligations),cs=statusList();return header('Resumen compartible','Reporte ejecutivo','Una vista para presentar prioridades por empresa y establecimiento y descargar CSV para revisión.',button('Descargar reporte CSV','exportObligations'))+`<div class="grid kpis">${[['Obligaciones',obs.length],['Vencidas',cs.red],['Próximos 30 días',cs.orange+cs.yellow],['Completadas',cs.green]].map(([t,n])=>`<div class="card kpi"><span>${t}</span><strong>${n}</strong><em>Registro demostrativo</em></div>`).join('')}</div><div class="card panel">${boxTitle('Detalle de compromisos')}${tableObligations(obs)}</div><div class="report-highlight"><h3>Del MVP a la plataforma</h3><p>Próximos módulos: períodos recurrentes por obligación, permisos como entidades independientes, inventario de residuos con entradas/salidas, normativa versionada, perfiles multiusuario, alertas programadas y asistencia documental auditada. Ninguna de estas funciones se presenta aquí como terminada.</p></div>`};
const pages={dashboard,projects,documents,obligations,alerts,waste,reports};
function render(){renderNav();document.querySelector('#crumb').textContent=' / '+views.find(x=>x[0]===view)[2];document.querySelector('#content').innerHTML=pages[view]();let g=document.querySelector('#globalScope');if(g)g.value=scope;let sh=document.querySelector('#search');if(sh){sh.addEventListener('input',e=>{let v=e.target.value;search=v;let start=e.target.selectionStart;const focused=document.activeElement===e.target;let rows=filtered(state.obligations).filter(o=>(o.title+' '+o.owner+' '+site(o.siteId)?.name).toLowerCase().includes(search.toLowerCase()));document.querySelector('.table-wrap').outerHTML=tableObligations(rows,true);if(focused)try{e.target.setSelectionRange(start,start)}catch(_){}})}}
function notify(t){let el=document.querySelector('#toastroot');el.innerHTML=`<div class="toast">✓ ${esc(t)}</div>`;setTimeout(()=>el.innerHTML='',2800)}
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" type="${type}" name="${name}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,options,value=''){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(o=>typeof o==='string'?`<option value="${esc(o)}" ${value===o?'selected':''}>${esc(o)}</option>`:`<option value="${o[0]}" ${String(value)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}
function openModal(kind,id){modal=kind;let title,desc,form='',submit='Guardar';const sidOpts=state.sites.map(s=>[s.id,s.name+' · '+s.city]);
 if(kind==='newCompany'){title='Registrar empresa';desc='Entidad de demostración sin validación con SRI.';form=`${field('Razón social *','name','text','','required')}${field('RUC (referencial)','ruc','text','DEMO-'+Math.floor(Math.random()*9999999),'required')}`;}
 if(kind==='newSite'){title='Nuevo establecimiento';desc='Vincula el proyecto a una empresa.';form=`${selectField('Empresa','companyId',state.companies.map(c=>[c.id,c.name]))}${field('Nombre *','name','text','','required')}${field('Ciudad / provincia','city')}${field('Actividad','activity')}`;}
 if(kind==='newObligation'){title='Registrar obligación';desc='No se infieren fechas ni requisitos legales.';form=`${selectField('Establecimiento','siteId',sidOpts,scope==='all'?'':scope)}${field('Título de compromiso *','title','text','','required')}${selectField('Frecuencia','freq',['Única','Mensual','Trimestral','Semestral','Anual','Sin especificar'])}${field('Fecha conocida (opcional)','due','date')}${field('Responsable','owner')}${field('Evidencia requerida','required')}`;}
 if(kind==='approve'){let c=state.candidates.find(x=>x.id===+id);if(!c)return;title='Aceptar fragmento';desc=`Fuente: ${c.doc}, página ${c.page}. Valida la aplicabilidad con un especialista.`;form=`<input type="hidden" name="candidateId" value="${c.id}"><input type="hidden" name="siteId" value="${c.siteId}">${field('Título confirmado *','title','text',c.frequency==='Anual'?'Monitoreo de ruido — documento ficticio':'Seguimiento — documento ficticio','required')}${selectField('Frecuencia confirmada','freq',['Sin especificar','Única','Mensual','Semestral','Anual'],c.frequency)}${field('Vencimiento verificado (opcional)','due','date')}${field('Responsable','owner')}${field('Evidencia requerida','required')}`;submit='Aceptar y registrar';}
 if(kind==='newWaste'){title='Registrar residuo';desc='Registro interno. Clasificación y gestores no verificados.';form=`${selectField('Establecimiento','siteId',sidOpts,scope==='all'?'':scope)}${field('Residuo *','name','text','','required')}${field('Cantidad (kg) *','qty','number','1','required min="0.01" step="0.01"')}${field('Fecha','date','date',day(0),'required')}${selectField('Clasificación declarada','classification',['Por determinar','Peligroso','Especial','No peligroso'])}${field('Almacenamiento','storage')}${field('Gestor (opcional)','manager')}${field('Referencia manifiesto','manifest')}`;}
 if(kind==='obligation'){let o=state.obligations.find(o=>o.id===+id);if(!o)return;title='Gestionar evidencia';desc=o.title+' · '+site(o.siteId)?.name;let reviewed=o.evidence.some(e=>e.reviewed);form=`<input type="hidden" name="obligationId" value="${o.id}"><div class="notice" style="margin-bottom:15px">${pill(status(o))} · Fecha: ${fmtDate(o.due)} · Responsable: ${esc(o.owner||'—')}</div><div class="field"><label>Agregar referencia de evidencia</label><input name="filename" type="file" accept=".pdf,.jpg,.jpeg,.png"><span class="smallprint">En esta demo solo se guarda el nombre del archivo. No se guarda su contenido. En Streamlit sí se archiva.</span></div><div style="display:grid;gap:9px;margin-top:15px">${o.evidence.map((e,i)=>`<div class="project"><div class="p-copy"><b>📎 ${esc(e.name)}</b><small>${e.reviewed?'Revisada':'Pendiente de revisión'}</small></div>${!e.reviewed?`<button type="button" class="btn sm light" data-act="review:${o.id}:${i}">Revisar</button>`:pill({t:'Validada',c:'green'})}</div>`).join('')||'<div class="empty">No hay evidencia registrada.</div>'}</div>${reviewed&&!o.completed?`<button type="button" class="btn" style="margin-top:17px" data-act="complete:${o.id}">✓ Confirmar cumplimiento</button>`:''}${o.completed?`<button type="button" class="btn danger" style="margin-top:17px" data-act="reopen:${o.id}">Reabrir obligación</button>`:''}`;submit='Agregar referencia';}
 if(kind==='pdfInfo'){title='Documento de demostración';desc='Muestra de dos páginas con fragmentos extraídos por heurísticas.';form='<div class="notice">En el paquete de la versión Python encontrarás <b>sample_docs/resolucion_ficticia_demo.pdf</b>. En la demo rápida se presentan dos fragmentos predefinidos, no se procesa un PDF.</div>';submit='Cerrar';}
 document.querySelector('#modalroot').innerHTML=`<div class="modal-shade" data-act="closeOverlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><h3>${esc(title)}</h3><p>${esc(desc)}</p></div><button class="modal-close" type="button" data-act="closeModal" aria-label="Cerrar">×</button></div><div class="modal-body"><form id="formModal" data-kind="${kind}"><div class="form-grid">${form}</div><div class="modal-actions"><button type="button" class="btn light" data-act="closeModal">Cancelar</button><button type="submit" class="btn">${submit}</button></div></form></div></div></div>`; if(kind==='pdfInfo')document.querySelector('#formModal').querySelector('[type=submit]').type='button',document.querySelector('#formModal').querySelector('[type=submit]').dataset.act='closeModal';}
function closeModal(){document.querySelector('#modalroot').innerHTML='';modal=''}
function nextId(items){return Math.max(0,...items.map(x=>x.id))+1}
function handleForm(form){const d=Object.fromEntries(new FormData(form).entries());let kind=form.dataset.kind;
 if(kind==='newCompany'){if(state.companies.some(c=>c.ruc===d.ruc.trim()))return notify('RUC ya existe en esta demo');state.companies.push({id:nextId(state.companies),name:d.name.trim(),ruc:d.ruc.trim()});view='projects';}
 if(kind==='newSite'){state.sites.push({id:nextId(state.sites),companyId:+d.companyId,name:d.name.trim(),city:d.city.trim(),activity:d.activity.trim(),permit:'Por verificar'});view='projects';}
 if(kind==='newObligation'||kind==='approve'){if(!d.title.trim())return;if(kind==='approve'){state.candidates.find(c=>c.id===+d.candidateId).status='approved'}state.obligations.push({id:nextId(state.obligations),siteId:+d.siteId,title:d.title.trim(),freq:d.freq,due:d.due||null,owner:d.owner.trim(),evidence:[],required:d.required.trim(),completed:false,source:kind==='approve'?'PDF ficticio, pág. '+state.candidates.find(c=>c.id===+d.candidateId).page:'Registro manual'});view='obligations';}
 if(kind==='newWaste'){if(!(+d.qty>0))return notify('Cantidad debe ser positiva');state.wastes.push({id:nextId(state.wastes),siteId:+d.siteId,name:d.name.trim(),date:d.date,qty:+d.qty,classification:d.classification,storage:d.storage,manager:d.manager||'No registrado',manifest:d.manifest||'—'});view='waste';}
 if(kind==='obligation'){let file=form.querySelector('input[type=file]')?.files?.[0];if(!file)return notify('Selecciona un archivo para asociar');state.obligations.find(o=>o.id===+d.obligationId).evidence.push({name:file.name,reviewed:false});}
 save();closeModal();render();notify('Información registrada en la demo local');}
function exportCsv(kind){const delim=';';let header,rows,filename;if(kind==='waste'){header=['Empresa','Proyecto','Fecha','Residuo','Cantidad kg','Clasificación','Almacenamiento','Gestor','Manifiesto'];rows=filtered(state.wastes).map(x=>[company(site(x.siteId)?.companyId)?.name,site(x.siteId)?.name,x.date,x.name,x.qty,x.classification,x.storage,x.manager,x.manifest]);filename='ecogestion_residuos_demo.csv'}else{header=['Empresa','Proyecto','Obligación','Frecuencia','Vencimiento','Estado','Responsable','Fuente'];rows=filtered(state.obligations).map(x=>[company(site(x.siteId)?.companyId)?.name,site(x.siteId)?.name,x.title,x.freq,x.due||'',status(x).t,x.owner,x.source]);filename='ecogestion_obligaciones_demo.csv'}const all=[header,...rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(delim)).join('\r\n');const blob=new Blob(['\ufeff'+all],{type:'text/csv;charset=utf-8'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);notify('CSV generado')}
document.addEventListener('click',e=>{const viewEl=e.target.closest('[data-view]');if(viewEl){view=viewEl.dataset.view;search='';render();document.querySelector('#side').classList.remove('open');return}const scopeEl=e.target.closest('[data-scope]');if(scopeEl){scope=scopeEl.dataset.scope;view='dashboard';render();return}const el=e.target.closest('[data-act]');if(!el)return;const cmd=el.dataset.act;
 if(cmd==='menu'){document.querySelector('#side').classList.toggle('open');return}
 if(cmd==='reset'){if(confirm('¿Restaurar todos los registros ficticios? Se perderán los cambios hechos dentro de esta demo.')){state=seed();scope='all';search='';save();view='dashboard';closeModal();render();notify('Demo restaurada')}return}
 if(cmd==='closeOverlay'){if(e.target===el)closeModal();return}if(cmd==='closeModal'){closeModal();return}
 if(['newCompany','newSite','newObligation','newWaste','pdfInfo'].includes(cmd)){openModal(cmd);return}
 if(cmd.startsWith('approve:')){openModal('approve',cmd.split(':')[1]);return}
 if(cmd.startsWith('discard:')){state.candidates.find(c=>c.id===+cmd.split(':')[1]).status='discarded';save();render();notify('Fragmento descartado');return}
 if(cmd.startsWith('obligation:')){openModal('obligation',cmd.split(':')[1]);return}
 if(cmd.startsWith('review:')){let [,id,idx]=cmd.split(':');state.obligations.find(o=>o.id===+id).evidence[+idx].reviewed=true;save();openModal('obligation',id);notify('Evidencia marcada como revisada');return}
 if(cmd.startsWith('complete:')){const o=state.obligations.find(o=>o.id===+cmd.split(':')[1]);if(!o.evidence.some(e=>e.reviewed))return notify('Debe existir evidencia revisada');o.completed=true;save();closeModal();render();notify('Compromiso marcado como cumplido');return}
 if(cmd.startsWith('reopen:')){state.obligations.find(o=>o.id===+cmd.split(':')[1]).completed=false;save();closeModal();render();notify('Obligación reabierta');return}
 if(cmd==='exportObligations')exportCsv('obligations');if(cmd==='exportWaste')exportCsv('waste');
});
document.addEventListener('submit',e=>{if(e.target.id==='formModal'){e.preventDefault();handleForm(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='globalScope'){scope=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body></html>
